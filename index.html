<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Management System</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#222;
}

header{
    background:linear-gradient(135deg,#075985,#0284c7);
    color:white;
    text-align:center;
    padding:22px 15px;
}

header h1{margin:0;font-size:22px}
header p{margin:7px 0 0;font-size:15px}

.container{
    max-width:900px;
    margin:auto;
    padding:18px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.menu-card{
    background:white;
    border-radius:14px;
    padding:25px 15px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

.menu-card:hover{transform:translateY(-2px)}

.section{display:none}
.section.active{display:block}

.back{
    display:inline-block;
    margin-bottom:15px;
    background:#334155;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}

.card{
    background:white;
    padding:18px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:18px;
}

h2{
    margin-top:0;
    color:#075985;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:16px;
    background:white;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 16px;
    font-size:15px;
    cursor:pointer;
}

.primary{background:#0284c7;color:white}
.success{background:#16a34a;color:white}
.danger{background:#dc2626;color:white}
.secondary{background:#475569;color:white}

.search{margin-bottom:15px}

.student-card{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
}

.student-top{
    display:flex;
    gap:14px;
    align-items:center;
}

.student-photo{
    width:65px;
    height:65px;
    border-radius:10px;
    object-fit:cover;
    border:1px solid #cbd5e1;
}

.student-info{flex:1}
.student-info h3{margin:0 0 5px}
.student-info p{margin:3px 0;font-size:14px}

.actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:10px;
}

.preview{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:10px;
    margin-top:8px;
    display:none;
}

.seat-result{margin-top:18px}

.seat-card{
    background:white;
    border:1px solid #dbeafe;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:14px;
}

.seat-number{
    min-width:75px;
    height:55px;
    background:#075985;
    color:white;
    border-radius:10px;
    display:flex;
